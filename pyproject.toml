[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iron-veil-core"
version = "1.0.0"
description = "Open-source indirect prompt-injection sanitizer and Priority-1 untrusted repository trap quarantiner for AI coding agents."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Veristrux Inc.", email = "argoness@veristrux.com"}]
keywords = ["ai-security", "prompt-injection", "claude-code", "antigravity", "llm-security"]

[project.urls]
Homepage = "https://argoness-prime.github.io/veristrux/"
Repository = "https://github.com/argoness-prime/iron-veil"

[project.scripts]
iron-veil-core = "iron_veil_core.cli:main"

[tool.setuptools.packages.find]
include = ["iron_veil_core*"]
